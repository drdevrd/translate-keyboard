name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            gradle assembleRelease \
              -PRELEASE_STORE_FILE=../../release.keystore \
              -PRELEASE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }} \
              -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
              -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: translate-keyboard-apk
          path: app/build/outputs/apk/**/*.apk
